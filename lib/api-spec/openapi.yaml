openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: event
    description: Event details and RSVP operations
  - name: admin
    description: Admin authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /event:
    get:
      operationId: getEvent
      tags: [event]
      summary: Get event details
      description: Returns the event currently accepting RSVPs
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    put:
      operationId: updateEvent
      tags: [event]
      summary: Update event details
      description: Replaces the event details (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in as admin
      description: Exchanges the admin password for a short-lived token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps:
    get:
      operationId: listRsvps
      tags: [event]
      summary: List RSVP responses
      description: Returns RSVP responses for the event (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: RSVP responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rsvp"
    post:
      operationId: createRsvp
      tags: [event]
      summary: Submit an RSVP
      description: Registers a family for the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "201":
          description: Saved RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpPublic"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: RSVPs are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/{id}:
    put:
      operationId: updateRsvp
      tags: [event]
      summary: Update an RSVP
      description: Replaces a family's RSVP details (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRsvp
      tags: [event]
      summary: Delete an RSVP
      description: Removes a family's RSVP (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not signed in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/{id}/table:
    put:
      operationId: assignRsvpTable
      tags: [event]
      summary: Assign a table
      description: Sets or clears the table a family is seated at (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpTableInput"
      responses:
        "200":
          description: Updated RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rsvp"
        "400":
          description: Invalid table number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/all:
    get:
      operationId: listPublicRsvps
      tags: [event]
      summary: List every RSVP for guests to browse
      description: Returns the public details of every RSVP, for guests to filter in the browser. Available only while the event's showAllRsvp switch is on.
      responses:
        "200":
          description: Every RSVP
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsvpPublic"
        "404":
          description: The event does not publish its RSVP list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: RSVPs are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/lookup:
    post:
      operationId: lookupRsvps
      tags: [event]
      summary: Find RSVPs by a family member's name or phone number
      description: Matches a whole name (father, mother or child), ignoring case and spaces, or the last 4 or more digits of the phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpLookupInput"
      responses:
        "200":
          description: Matching families
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsvpPublic"
        "400":
          description: Invalid search term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many lookups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: RSVPs are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/confirmation/{token}:
    get:
      operationId: getRsvpConfirmation
      tags: [event]
      summary: Get a family's RSVP by its private link token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpPublic"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: RSVPs are closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/summary:
    get:
      operationId: getRsvpSummary
      tags: [event]
      summary: Get RSVP summary
      description: Returns aggregate RSVP totals for the event
      responses:
        "200":
          description: RSVP summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpSummary"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EventTheme:
      type: string
      description: Color palette for the invitation; "custom" builds one from themeColor and themeAccent
      enum: [rose, sage, sky, lavender, butter, navy, custom]
    EventCardStyle:
      type: string
      description: Card shape and ornaments for the invitation, chosen by the kind of event
      enum: [classic, dinner, birthday, party, performance, ceremony]
    EventLanguage:
      type: string
      description: Language the guest pages are shown in; only the admin can change it
      enum: [ko, en]
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    AdminSession:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt
    EventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        subtitle:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: Empty when the invitation shows only a start time
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
        timezone:
          type: string
        venue:
          type: string
        address:
          type: string
        dressCode:
          type: string
        hostName:
          type: string
        capacity:
          type: integer
          minimum: 0
        imageUrl:
          type: string
        featuredNote:
          type: string
        theme:
          $ref: "#/components/schemas/EventTheme"
        cardStyle:
          $ref: "#/components/schemas/EventCardStyle"
        themeColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Main colour the "custom" theme is built from
        themeAccent:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Frame and detail colour of the "custom" theme
        language:
          $ref: "#/components/schemas/EventLanguage"
        isFamilyType:
          type: boolean
          description: Family events ask for both parents and their children; otherwise one person registers alone
        belongTeamLabel:
          type: string
          maxLength: 30
          description: Label for the team field on the RSVP form; empty hides the field
        belongDeptLabel:
          type: string
          maxLength: 30
          description: Label for the department field on the RSVP form; empty hides the field
        belongDeptOptions:
          type: array
          maxItems: 20
          description: Choices for the department field; empty turns it back into a free-text box
          items:
            $ref: "#/components/schemas/ChoiceOption"
        tableCount:
          type: integer
          minimum: 1
          maximum: 50
          description: How many tables the seating board shows
        childGroups:
          type: array
          maxItems: 10
          description: Groups the guest picks one of for each child
          items:
            $ref: "#/components/schemas/ChildGroup"
        messageLabel:
          type: string
          maxLength: 30
          description: Heading for the RSVP form's message box; empty hides the box
        messagePlaceholder:
          type: string
          maxLength: 100
        showSummary:
          type: boolean
          description: Whether the invitation shows guests the running attendance totals
        showAllRsvp:
          type: boolean
          description: Whether the lookup page lists every RSVP for guests to filter, instead of searching one name at a time
        rsvpClosed:
          type: boolean
          description: Whether RSVPs are closed; guests then see only a closed notice and no RSVP data
      required:
        - title
        - subtitle
        - description
        - date
        - startTime
        - endTime
        - timezone
        - venue
        - address
        - dressCode
        - hostName
        - capacity
        - imageUrl
        - featuredNote
        - theme
        - cardStyle
        - themeColor
        - themeAccent
        - language
        - isFamilyType
        - belongTeamLabel
        - belongDeptLabel
        - belongDeptOptions
        - tableCount
        - childGroups
        - messageLabel
        - messagePlaceholder
        - showSummary
        - showAllRsvp
        - rsvpClosed
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        timezone:
          type: string
        venue:
          type: string
        address:
          type: string
        dressCode:
          type: string
        hostName:
          type: string
        capacity:
          type: integer
        imageUrl:
          type: string
        featuredNote:
          type: string
        theme:
          $ref: "#/components/schemas/EventTheme"
        cardStyle:
          $ref: "#/components/schemas/EventCardStyle"
        themeColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Main colour the "custom" theme is built from
        themeAccent:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Frame and detail colour of the "custom" theme
        language:
          $ref: "#/components/schemas/EventLanguage"
        isFamilyType:
          type: boolean
          description: Family events ask for both parents and their children; otherwise one person registers alone
        belongTeamLabel:
          type: string
          maxLength: 30
          description: Label for the team field on the RSVP form; empty hides the field
        belongDeptLabel:
          type: string
          maxLength: 30
          description: Label for the department field on the RSVP form; empty hides the field
        belongDeptOptions:
          type: array
          maxItems: 20
          description: Choices for the department field; empty turns it back into a free-text box
          items:
            $ref: "#/components/schemas/ChoiceOption"
        tableCount:
          type: integer
          minimum: 1
          maximum: 50
          description: How many tables the seating board shows
        childGroups:
          type: array
          maxItems: 10
          description: Groups the guest picks one of for each child
          items:
            $ref: "#/components/schemas/ChildGroup"
        messageLabel:
          type: string
          maxLength: 30
          description: Heading for the RSVP form's message box; empty hides the box
        messagePlaceholder:
          type: string
          maxLength: 100
        showSummary:
          type: boolean
          description: Whether the invitation shows guests the running attendance totals
        showAllRsvp:
          type: boolean
          description: Whether the lookup page lists every RSVP for guests to filter, instead of searching one name at a time
        rsvpClosed:
          type: boolean
          description: Whether RSVPs are closed; guests then see only a closed notice and no RSVP data
      required:
        - id
        - title
        - subtitle
        - description
        - date
        - startTime
        - endTime
        - timezone
        - venue
        - address
        - dressCode
        - hostName
        - capacity
        - imageUrl
        - featuredNote
        - theme
        - cardStyle
        - themeColor
        - themeAccent
        - language
        - isFamilyType
        - belongTeamLabel
        - belongDeptLabel
        - belongDeptOptions
        - tableCount
        - childGroups
        - messageLabel
        - messagePlaceholder
        - showSummary
        - showAllRsvp
        - rsvpClosed
    RsvpTableInput:
      type: object
      properties:
        tableNumber:
          type: ["integer", "null"]
          minimum: 1
          maximum: 50
      required:
        - tableNumber
    ChoiceOption:
      type: object
      description: One selectable option; the value is stored on the RSVP, the label is what guests see
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 50
        label:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - value
        - label
    ChildGroup:
      type: object
      description: A group the guest picks for a child; its ages are shown beside the name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
        minAge:
          type: integer
          minimum: 0
          maximum: 30
        maxAge:
          type: integer
          minimum: 0
          maximum: 30
      required:
        - name
        - minAge
        - maxAge
    RsvpChild:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        group:
          type: string
          maxLength: 30
          description: Name of the child group the guest picked; empty when the event has no groups
        age:
          type: integer
          minimum: 0
          maximum: 30
          description: Only on children saved before the form asked for a group instead of an age
      required:
        - name
    RsvpPublic:
      type: object
      description: What a family (or anyone who can look them up) can see; the phone number is masked
      properties:
        confirmToken:
          type: string
        fatherName:
          type: string
        motherName:
          type: string
        phoneNumberMasked:
          type: string
        belongTeam:
          type: ["string", "null"]
        belongDept:
          type: ["string", "null"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/RsvpChild"
        adultCount:
          type: integer
        childCount:
          type: integer
        totalMembers:
          type: integer
        tableNumber:
          type: ["integer", "null"]
          minimum: 1
          maximum: 50
          description: Table the family is seated at; assigned by the admin only
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - confirmToken
        - fatherName
        - motherName
        - phoneNumberMasked
        - belongTeam
        - belongDept
        - children
        - adultCount
        - childCount
        - totalMembers
        - tableNumber
        - message
        - createdAt
    Rsvp:
      type: object
      description: Full RSVP record, admin only
      properties:
        id:
          type: integer
        name:
          type: string
        fatherName:
          type: string
        motherName:
          type: string
        phoneNumber:
          type: ["string", "null"]
        belongTeam:
          type: ["string", "null"]
        belongDept:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/RsvpChild"
        adultCount:
          type: integer
        childCount:
          type: integer
        guestCount:
          type: integer
        tableNumber:
          type: ["integer", "null"]
          minimum: 1
          maximum: 50
          description: Table the family is seated at; assigned by the admin only
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - fatherName
        - motherName
        - phoneNumber
        - belongTeam
        - belongDept
        - email
        - children
        - adultCount
        - childCount
        - guestCount
        - tableNumber
        - message
        - createdAt
    RsvpInput:
      type: object
      properties:
        fatherName:
          type: string
          maxLength: 50
        motherName:
          type: string
          maxLength: 50
        phoneNumber:
          type: ["string", "null"]
          maxLength: 30
        belongTeam:
          type: ["string", "null"]
          maxLength: 50
        belongDept:
          type: ["string", "null"]
          maxLength: 50
        children:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RsvpChild"
        message:
          type: ["string", "null"]
          maxLength: 500
      required:
        - fatherName
        - motherName
        - children
    RsvpLookupInput:
      type: object
      properties:
        query:
          type: string
          description: A family member's whole name, or the last 4 or more digits of the phone number
          minLength: 1
          maxLength: 50
      required:
        - query
    RsvpSummary:
      type: object
      properties:
        totalResponses:
          type: integer
        attendingResponses:
          type: integer
        declinedResponses:
          type: integer
        totalGuests:
          type: integer
        totalAdults:
          type: integer
        totalChildren:
          type: integer
        capacity:
          type: integer
        spotsRemaining:
          type: integer
      required:
        - totalResponses
        - attendingResponses
        - declinedResponses
        - totalGuests
        - totalAdults
        - totalChildren
        - capacity
        - spotsRemaining
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

