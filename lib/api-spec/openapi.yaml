openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: event
    description: Event details and RSVP operations
  - name: admin
    description: Admin authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /event:
    get:
      operationId: getEvent
      tags: [event]
      summary: Get event details
      description: Returns the event currently accepting RSVPs
      responses:
        "200":
          description: Event details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    put:
      operationId: updateEvent
      tags: [event]
      summary: Update event details
      description: Replaces the event details (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not signed in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Sign in as admin
      description: Exchanges the admin password for a short-lived token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Wrong password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps:
    get:
      operationId: listRsvps
      tags: [event]
      summary: List RSVP responses
      description: Returns RSVP responses for the event (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: RSVP responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rsvp"
    post:
      operationId: createRsvp
      tags: [event]
      summary: Submit an RSVP
      description: Registers a family for the event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpInput"
      responses:
        "201":
          description: Saved RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpPublic"
        "400":
          description: Invalid RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/lookup:
    post:
      operationId: lookupRsvps
      tags: [event]
      summary: Find RSVPs by a family member's name
      description: Matches a whole name (father, mother or child), ignoring case and spaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RsvpLookupInput"
      responses:
        "200":
          description: Matching families
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RsvpPublic"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many lookups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/confirmation/{token}:
    get:
      operationId: getRsvpConfirmation
      tags: [event]
      summary: Get a family's RSVP by its private link token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Saved RSVP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpPublic"
        "404":
          description: Unknown token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rsvps/summary:
    get:
      operationId: getRsvpSummary
      tags: [event]
      summary: Get RSVP summary
      description: Returns aggregate RSVP totals for the event
      responses:
        "200":
          description: RSVP summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RsvpSummary"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    EventTheme:
      type: string
      description: Color palette for the invitation
      enum: [rose, sage, sky, lavender, butter, navy]
    AdminLoginInput:
      type: object
      properties:
        password:
          type: string
      required:
        - password
    AdminSession:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - token
        - expiresAt
    EventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        subtitle:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          description: Empty when the invitation shows only a start time
          pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9])?$"
        timezone:
          type: string
        venue:
          type: string
        address:
          type: string
        dressCode:
          type: string
        hostName:
          type: string
        capacity:
          type: integer
          minimum: 0
        imageUrl:
          type: string
        featuredNote:
          type: string
        theme:
          $ref: "#/components/schemas/EventTheme"
        belongTeamLabel:
          type: string
          maxLength: 30
          description: Label for the team field on the RSVP form; empty hides the field
        messageLabel:
          type: string
          maxLength: 30
          description: Heading for the RSVP form's message box; empty hides the box
        messagePlaceholder:
          type: string
          maxLength: 100
      required:
        - title
        - subtitle
        - description
        - date
        - startTime
        - endTime
        - timezone
        - venue
        - address
        - dressCode
        - hostName
        - capacity
        - imageUrl
        - featuredNote
        - theme
        - belongTeamLabel
        - messageLabel
        - messagePlaceholder
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Event:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        timezone:
          type: string
        venue:
          type: string
        address:
          type: string
        dressCode:
          type: string
        hostName:
          type: string
        capacity:
          type: integer
        imageUrl:
          type: string
        featuredNote:
          type: string
        theme:
          $ref: "#/components/schemas/EventTheme"
        belongTeamLabel:
          type: string
          maxLength: 30
          description: Label for the team field on the RSVP form; empty hides the field
        messageLabel:
          type: string
          maxLength: 30
          description: Heading for the RSVP form's message box; empty hides the box
        messagePlaceholder:
          type: string
          maxLength: 100
      required:
        - id
        - title
        - subtitle
        - description
        - date
        - startTime
        - endTime
        - timezone
        - venue
        - address
        - dressCode
        - hostName
        - capacity
        - imageUrl
        - featuredNote
        - theme
        - belongTeamLabel
        - messageLabel
        - messagePlaceholder
    RsvpChild:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        age:
          type: integer
          minimum: 0
          maximum: 30
      required:
        - name
        - age
    RsvpPublic:
      type: object
      description: What a family (or anyone with the lookup name) can see; the phone number is masked
      properties:
        confirmToken:
          type: string
        fatherName:
          type: string
        motherName:
          type: string
        phoneNumberMasked:
          type: string
        belongTeam:
          type: ["string", "null"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/RsvpChild"
        adultCount:
          type: integer
        childCount:
          type: integer
        totalMembers:
          type: integer
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - confirmToken
        - fatherName
        - motherName
        - phoneNumberMasked
        - belongTeam
        - children
        - adultCount
        - childCount
        - totalMembers
        - message
        - createdAt
    Rsvp:
      type: object
      description: Full RSVP record, admin only
      properties:
        id:
          type: integer
        name:
          type: string
        fatherName:
          type: string
        motherName:
          type: string
        phoneNumber:
          type: ["string", "null"]
        belongTeam:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/RsvpChild"
        adultCount:
          type: integer
        childCount:
          type: integer
        guestCount:
          type: integer
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - fatherName
        - motherName
        - phoneNumber
        - belongTeam
        - email
        - children
        - adultCount
        - childCount
        - guestCount
        - message
        - createdAt
    RsvpInput:
      type: object
      properties:
        fatherName:
          type: string
          maxLength: 50
        motherName:
          type: string
          maxLength: 50
        phoneNumber:
          type: ["string", "null"]
          maxLength: 30
        belongTeam:
          type: ["string", "null"]
          maxLength: 50
        children:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RsvpChild"
        message:
          type: ["string", "null"]
          maxLength: 500
      required:
        - fatherName
        - motherName
        - children
    RsvpLookupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
      required:
        - name
    RsvpSummary:
      type: object
      properties:
        totalResponses:
          type: integer
        attendingResponses:
          type: integer
        declinedResponses:
          type: integer
        totalGuests:
          type: integer
        totalAdults:
          type: integer
        totalChildren:
          type: integer
        capacity:
          type: integer
        spotsRemaining:
          type: integer
      required:
        - totalResponses
        - attendingResponses
        - declinedResponses
        - totalGuests
        - totalAdults
        - totalChildren
        - capacity
        - spotsRemaining
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

